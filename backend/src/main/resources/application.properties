# ── Server ─────────────────────────────────────────────────
server.port=${PORT:8080}
server.servlet.context-path=/

# ── Database — PostgreSQL (Render free tier) ─────────────────
# Render gives you a single DATABASE_URL — we split it into pieces below.
# Render's DATABASE_URL looks like:
#   postgresql://user:password@host:port/dbname
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ── JPA ─────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ── JWT ─────────────────────────────────────────────────────
mana.jwt.secret=${JWT_SECRET:bWFuYVNlY3JldEtleUZvckpXVEF1dGhlbnRpY2F0aW9uMjAyNQ==}
mana.jwt.expiration-ms=86400000
mana.jwt.refresh-expiration-ms=604800000

# ── File Upload ─────────────────────────────────────────────
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
mana.upload.dir=${UPLOAD_DIR:uploads/}

# ── Razorpay ────────────────────────────────────────────────
mana.razorpay.key-id=${RAZORPAY_KEY_ID:rzp_test_placeholder}
mana.razorpay.key-secret=${RAZORPAY_KEY_SECRET:placeholder}

# ── Claude AI ───────────────────────────────────────────────
mana.claude.api-key=${CLAUDE_API_KEY:}
mana.claude.model=claude-sonnet-4-6
mana.claude.max-tokens=500

# ── Logging ─────────────────────────────────────────────────
logging.level.root=WARN
logging.level.com.mana=INFO
logging.level.org.springframework.security=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# ── Jackson ─────────────────────────────────────────────────
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=Asia/Kolkata
spring.jackson.default-property-inclusion=non_null
